<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>株式会社LIV 人事部ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Anton+SC&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--font:"Space Mono",monospace;--jp:"Noto Sans JP",sans-serif}
  html,body{
    height:100%;background:#000;color:#fff;overflow-x:hidden;overflow-y:auto;
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  /* ===== HERO ===== */
  .hero{position:relative;width:100%;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(.62) contrast(1.05)}
  .hero .veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 35%,rgba(0,0,0,.55) 100%)}
  /* dot grid */
  .dots{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.05;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:24px 24px}
  /* watermark */
  .mark{position:absolute;left:50%;top:calc(50% + 50px);transform:translate(-50%,-50%);z-index:2;pointer-events:none;
    font-family:"Anton SC",sans-serif;text-transform:uppercase;letter-spacing:-4px;line-height:.8;
    font-size:clamp(120px,30vw,521px);opacity:.10;white-space:nowrap;
    background:radial-gradient(circle,rgba(142,127,148,0) 0%,#8E7F94 70%);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* nav (brand only, no buttons) */
  .nav{position:fixed;top:0;left:0;width:100%;height:80px;z-index:50;display:flex;align-items:center;padding:0 clamp(16px,4vw,40px);
    opacity:0;transition:opacity .8s ease}
  .brand{display:flex;align-items:center;gap:10px;height:48px;padding:0 18px;border-radius:14px;
    background:rgba(255,255,255,.13);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .brand svg{width:18px;height:18px}
  .brand span{font-size:15px;font-weight:500;letter-spacing:-.01em}

  /* hero content */
  .wrap{position:relative;z-index:10;flex:1;display:flex;flex-direction:column;
    padding:96px clamp(16px,4vw,40px) clamp(32px,5vh,56px)}
  .spacer{flex:1}
  .bottom{display:flex;flex-direction:column;gap:28px}
  @media(min-width:900px){.bottom{flex-direction:row;align-items:flex-end;justify-content:space-between}}

  .label{font-size:13px;letter-spacing:.18em;color:rgba(255,255,255,.55);text-transform:uppercase;margin-bottom:18px;min-height:1em}
  h1{font-weight:300;line-height:1.0;letter-spacing:-.03em;font-family:var(--jp);
    font-size:clamp(34px,7vw,82px);opacity:0;transform:translateY(22px);transition:opacity 1s ease,transform 1s ease}
  h1 .thin{color:rgba(255,255,255,.55)}
  .desc{max-width:30rem;margin-top:22px;font-size:clamp(13px,1.4vw,15px);line-height:1.75;color:rgba(255,255,255,.62);
    opacity:0;transform:translateY(22px);transition:opacity 1s ease .15s,transform 1s ease .15s}

  /* CTA */
  .cta{display:inline-flex;align-items:center;gap:12px;margin-top:34px;height:56px;padding:0 30px;border-radius:999px;
    background:#fff;color:#000;font-family:var(--font);font-size:15px;font-weight:700;text-decoration:none;letter-spacing:.01em;
    transition:transform .25s ease,background .25s ease;opacity:0;transform:translateY(22px);
    transition:opacity 1s ease .3s,transform 1s ease .3s,background .25s ease}
  .cta:hover{background:#e2e2e6;transform:translateY(0) scale(1.03)}
  .cta:active{transform:scale(.97)}
  .cta .arrow{transition:transform .25s ease}
  .cta:hover .arrow{transform:translateX(4px)}

  /* right side scramble echo */
  .right{font-family:var(--font);text-align:left}
  @media(min-width:900px){.right{text-align:right}}
  .right .big{font-weight:300;line-height:.95;letter-spacing:-.03em;font-size:clamp(34px,7vw,78px);color:#fff}
  .right .big .thin{color:rgba(255,255,255,.45)}

  /* entrance reveal */
  body.in .nav{opacity:1}
  body.in h1,body.in .desc,body.in .cta{opacity:1;transform:translateY(0)}

  .scrub-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;font-size:11px;letter-spacing:.2em;
    color:rgba(255,255,255,.35);text-transform:uppercase;opacity:0;transition:opacity 1s ease 1.2s}
  body.in .scrub-hint{opacity:1}
  @media(hover:none){.scrub-hint{display:none}}
</style>
</head>
<body>
<div class="hero">
  <video id="heroV" muted playsinline preload="auto"
         src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_083515_290e5a10-0b95-41af-a5e2-32b6389baa4d.mp4"></video>
  <div class="veil"></div>
  <div class="dots"></div>
  <div class="mark">PEOPLE</div>

  <nav class="nav">
    <div class="brand">
      <svg viewBox="-50 -50 100 100" fill="#fff" aria-hidden="true">
        <g>
          <path d="M 1.5,23 L 1.5,33 C 1.5,38.5 6,43 11.5,43 L 16.5,43 C 22,43 26.5,38.5 26.5,33 Q 28,28 33,26.5 C 38.5,26.5 43,22 43,16.5 L 43,11.5 C 43,6 38.5,1.5 33,1.5 L 23,1.5 Q 12,12 1.5,23 Z"/>
          <path transform="rotate(90)" d="M 1.5,23 L 1.5,33 C 1.5,38.5 6,43 11.5,43 L 16.5,43 C 22,43 26.5,38.5 26.5,33 Q 28,28 33,26.5 C 38.5,26.5 43,22 43,16.5 L 43,11.5 C 43,6 38.5,1.5 33,1.5 L 23,1.5 Q 12,12 1.5,23 Z"/>
          <path transform="rotate(180)" d="M 1.5,23 L 1.5,33 C 1.5,38.5 6,43 11.5,43 L 16.5,43 C 22,43 26.5,38.5 26.5,33 Q 28,28 33,26.5 C 38.5,26.5 43,22 43,16.5 L 43,11.5 C 43,6 38.5,1.5 33,1.5 L 23,1.5 Q 12,12 1.5,23 Z"/>
          <path transform="rotate(270)" d="M 1.5,23 L 1.5,33 C 1.5,38.5 6,43 11.5,43 L 16.5,43 C 22,43 26.5,38.5 26.5,33 Q 28,28 33,26.5 C 38.5,26.5 43,22 43,16.5 L 43,11.5 C 43,6 38.5,1.5 33,1.5 L 23,1.5 Q 12,12 1.5,23 Z"/>
        </g>
      </svg>
      <span>株式会社LIV</span>
    </div>
  </nav>

  <div class="wrap">
    <div class="spacer"></div>
    <div class="bottom">
      <div class="left">
        <div class="label" data-scramble="HR DEPARTMENT &middot; PEOPLE ANALYTICS" data-delay="100"></div>
        <h1>株式会社LIV<br><span class="thin">人事部ツール</span></h1>
        <p class="desc">株式会社LIVの人事部が運用する、組織マネジメント・ツールのポータルです。上長評価をはじめとした各種データを通じて、メンバー一人ひとりの声を可視化し、組織の成長とより良いマネジメントの実現を支えます。</p>
        <a class="cta" href="dashboard.html">上長評価サイトへ <span class="arrow">&rarr;</span></a>
      </div>
      <div class="right">
        <div class="big" data-scramble="ONE" data-delay="700" data-keep="true">ONE</div>
        <div class="big"><span class="thin" data-scramble="TEAM" data-delay="1000" data-keep="true">TEAM</span></div>
      </div>
    </div>
  </div>
  <div class="scrub-hint">&larr; move mouse to scrub &rarr;</div>
</div>

<script>
/* ===== entrance ===== */
setTimeout(function(){document.body.classList.add('in');}, 800);

/* ===== ScrambleIn (left-to-right reveal) ===== */
var CHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+~|}{[]:;?><";
function scrambleIn(el){
  var target=el.getAttribute('data-scramble');
  var delay=parseInt(el.getAttribute('data-delay')||'0',10);
  // decode simple html entities used above
  var tmp=document.createElement('textarea'); tmp.innerHTML=target; target=tmp.value;
  var reveal=0, frame=0;
  setTimeout(function(){
    var iv=setInterval(function(){
      reveal+=0.5; frame++;
      var out="";
      for(var i=0;i<target.length;i++){
        var ch=target[i];
        if(ch===" "){out+=" ";continue;}
        if(i<reveal){out+=ch;}
        else if(i<reveal+3){out+=CHARS[Math.floor(Math.random()*CHARS.length)];}
        else{out+="";}
      }
      el.textContent=out;
      if(reveal>=target.length){el.textContent=target;clearInterval(iv);}
    },25);
  },delay);
}
document.querySelectorAll('[data-scramble]').forEach(scrambleIn);

/* ===== hero video: mouse-scrub on desktop, autoplay loop on touch ===== */
(function(){
  var v=document.getElementById('heroV');
  var canHover=window.matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(!canHover){ v.loop=true; var p=v.play(); if(p&&p.catch)p.catch(function(){}); return; }

  var SENS=0.8, targetT=0, lastX=null, seeking=false, dur=0;
  v.addEventListener('loadedmetadata',function(){dur=v.duration||0;try{v.currentTime=0.01;}catch(e){}});
  function doSeek(){
    if(seeking||!dur)return;
    var t=Math.max(0,Math.min(dur-0.05,targetT));
    if(Math.abs(t-v.currentTime)<0.005)return;
    seeking=true; try{v.currentTime=t;}catch(e){seeking=false;}
  }
  v.addEventListener('seeked',function(){seeking=false;doSeek();});
  window.addEventListener('mousemove',function(e){
    if(lastX===null){lastX=e.clientX;return;}
    var dx=e.clientX-lastX; lastX=e.clientX;
    var frac=dx/window.innerWidth;          // fraction of viewport moved
    targetT+=frac*dur*SENS;                 // scrub proportional to duration
    if(dur){ if(targetT<0)targetT+=dur; if(targetT>dur)targetT-=dur; } // wrap
    doSeek();
  },{passive:true});
})();
</script>
</body>
</html>
